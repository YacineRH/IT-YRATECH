name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Typage, tests et build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yratech
          POSTGRES_PASSWORD: yratech
          POSTGRES_DB: yratech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yratech -d yratech_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yratech:yratech@localhost:5432/yratech_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: verifier
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t yratech-api .
      - run: docker build --target web -t yratech-web .

  deployer:
    name: Deploiement VPS
    runs-on: ubuntu-latest
    needs: images
    # Active seulement sur main, une fois la variable DEPLOY_ENABLED=true et
    # les secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH configures.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - name: Mise a jour et redemarrage sur le VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_PATH' && git fetch --quiet origin main && git reset --hard origin/main && docker compose up -d --build --remove-orphans && docker image prune -f"
      - name: Verification de sante
        env:
          URL_SANTE: ${{ vars.URL_SANTE }}
        if: env.URL_SANTE != ''
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$URL_SANTE" && exit 0
            sleep 5
          done
          echo "L'API ne repond pas apres le deploiement" && exit 1
